<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المُصيغ الذكي - صياغة الردود والرسائل الاحترافية</title>
    <!-- Tailwind CSS للتصميم السريع والأنيق -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6">

    <!-- Container الرئيسي -->
    <div class="max-w-2xl mx-auto w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl my-auto">
        
        <!-- الهيدر -->
        <div class="text-center mb-6">
            <div class="inline-block bg-indigo-500/10 text-indigo-400 p-3 rounded-full mb-3 border border-indigo-500/20">
                ✨
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold text-white mb-2">المُصيغ الذكي (Smart Communicator)</h1>
            <p class="text-slate-400 text-sm sm:text-base">حول رسائلك العفوية أو الغاضبة إلى ردود احترافية وحازمة تحفظ حقك وتظهر رقيّك</p>
        </div>

        <!-- المكونات -->
        <div class="space-y-4">
            
            <!-- أدخل API Key -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">مفتاح Gemini API (مجاني):</label>
                <input type="password" id="apiKey" placeholder="أدخل مفتاح GEMINI_API_KEY هنا..." 
                       class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition">
            </div>

            <!-- مربع إدخال المشكلة -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">اكتب رسالتك أو مشكلتك بالعامية:</label>
                <textarea id="userInput" rows="4" placeholder="مثال: الزبون يماطل في الدفع ومو راضي يحول المبلغ المتفق عليه ويبغاني اكمل شغل بدون ما يدفع..." 
                          class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition"></textarea>
            </div>

            <!-- اختيار النبرة -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">اختر نبرة الرد المطلوبة:</label>
                <select id="tone" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                    <option value="حازم وقانوني يحفظ الحقوق">🛡️ حازم وقانوني (حفظ الحقوق والالتزامات)</option>
                    <option value="رسمي ودبلوماسي لإيميلات العمل">💼 رسمي ودبلوماسي (إيميل عمل راقي)</option>
                    <option value="مؤدب مع اعتذار ورفض أنيق">🤝 رفض أنيق وبأدب (بدون إحراج)</option>
                    <option value="مباشر وقوي بدون مجاملات">⚡ مباشر وقوي (إيقاف التجاوزات)</option>
                </select>
            </div>

            <!-- زر التوليد -->
            <button onclick="generateResponse()" id="submitBtn" 
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2">
                <span>صياغة الرد الذكي</span>
                <span>✨</span>
            </button>

            <!-- منطقة النتيجة -->
            <div id="outputContainer" class="hidden mt-6 pt-4 border-t border-slate-700">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-semibold text-indigo-400">الرد المصاغ وجاهز للإرسال:</span>
                    <button onclick="copyText()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 py-1 px-3 rounded-lg transition flex items-center gap-1">
                        📋 نسخ النص
                    </button>
                </div>
                <div id="outputText" class="bg-slate-900 border border-slate-700 rounded-xl p-4 text-sm text-slate-200 whitespace-pre-wrap leading-relaxed"></div>
            </div>

        </div>
    </div>

    <!-- الفوتر -->
    <footer class="text-center text-xs text-slate-500 mt-6">
        تم البناء بواسطة الذكاء الاصطناعي | جميع الحقوق محفوظة
    </footer>

    <!-- السكربت والربط مع Gemini API -->
    <script>
        async function generateResponse() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const userInput = document.getElementById('userInput').value.trim();
            const tone = document.getElementById('tone').value;
            const outputContainer = document.getElementById('outputContainer');
            const outputText = document.getElementById('outputText');
            const submitBtn = document.getElementById('submitBtn');

            if (!apiKey) {
                alert('يرجى إدخال مفتاح Gemini API أولاً!');
                return;
            }
            if (!userInput) {
                alert('يرجى كتابة الرسالة أو المشكلة أولاً!');
                return;
            }

            // تغيير حالة الزر أثناء التحميل
            submitBtn.disabled = true;
            submitBtn.innerText = 'جاري الصياغة... ⏳';
            outputContainer.classList.add('hidden');

            const prompt = `أنت خبير في التواصل الاحترافي وصياغة الرسائل. 
قام المستخدم بكتابة هذه الرسالة/المشكلة بالعامية أو بشكل غير منظم:
"${userInput}"

المطلوب منك: إعادة صياغة هذا الكلام إلى رد احترافي مكتوب بنبرة (${tone}).
التعليمات:
1. اعطني النص المصاغ مباشرة بدون مقدمات أو تحيات فارغة من طرفك كذكاء اصطناعي.
2. استخدم لغة سليمة وفصيحة وتناسب سياق المعاملة.
3. افصل النص بوضوح ليكون جاهزاً للنسخ واللصق فوراً.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    outputText.innerText = data.candidates[0].content.parts[0].text;
                    outputContainer.classList.remove('hidden');
                } else {
                    alert('حدث خطأ في استجابة API، تأكد من صحة المفتاح.');
                }
            } catch (error) {
                console.error(error);
                alert('تعذر الاتصال بالخدمة. تأكد من اتصال النت وصحة المفتاح.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'صياغة الرد الذكي ✨';
            }
        }

        function copyText() {
            const text = document.getElementById('outputText').innerText;
            navigator.clipboard.writeText(text);
            alert('تم نسخ الرد بنجاح! 📋');
        }
    </script>
</body>
</html>
